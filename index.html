<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 RedLine Zero</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ====== ФОРМА ВХОДА ====== -->
        <div id="loginForm">
            <div class="header">
                <h1>🔴 RedLine Zero</h1>
                <p>Вход в систему</p>
            </div>
            <div class="login-box">
                <input type="text" id="loginUsername" placeholder="Позывной">
                <input type="password" id="loginPassword" placeholder="Пароль">
                <button onclick="login()">🔑 Войти</button>
                <div id="loginMessage" class="error"></div>
                <div style="margin-top: 10px; font-size: 0.8rem; color: #555; text-align: center;">
                    Контакты: @redline_zero
                </div>
            </div>
        </div>

        <!-- ====== ЧАТ ====== -->
        <div id="chatApp" style="display: none;">
            <div class="header">
                <h1>🔴 RedLine Zero</h1>
                <p id="chatUser">
                    Пользователь: <span id="displayUsername"></span>
                    <span style="color: #888; font-size: 0.8rem;">
                        (<span id="displayRole"></span> | <span id="displayBranch"></span>)
                    </span>
                </p>
            </div>

            <div class="status" id="status">🟢 Подключение...</div>

            <div class="chat">
                <div class="messages" id="messages">
                    <div class="msg system">🔴 Добро пожаловать в RedLine Zero</div>
                </div>

                <div class="users-list" id="users"></div>

                <div class="input-area">
                    <input type="text" id="message" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">➤</button>
                </div>
            </div>

            <div class="footer">
                🔴 RedLine Zero — 2026
                <button onclick="logout()" style="background: #ff6b6b; padding: 4px 12px; border: none; border-radius: 4px; color: white; cursor: pointer; margin-left: 20px;">🚪 Выйти</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
