<!DOCTYPE html>
<html>
<head>
  <title>RL0 Chat</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div id="app">
    <div id="login">
      <div class="logo">⧫ REDLINE ZERO</div>
      <h2>Вход в чат</h2>
      <input id="nick" placeholder="Позывной" />
      <input id="pass" type="password" placeholder="Пароль (xxxxx-xxxxx-xxxxx)" />
      <button onclick="login()">Войти</button>
      <div id="error"></div>
    </div>
    <div id="chat" style="display:none;">
      <div class="header">
        <span>⧫ RL0 CHAT</span>
        <span id="status">● Подключено</span>
      </div>
      <div id="messages"></div>
      <div class="input-area">
        <input id="msg" placeholder="Сообщение..." />
        <button onclick="send()">➤</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
